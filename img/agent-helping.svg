<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="t">
  <title id="t">Un robot amichevole porge una ciotola calda a una famiglia (illustrazione originale di AI Against Hunger)</title>
  <!-- Illustrazione originale, disegnata a mano per AI Against Hunger. Nessun personaggio protetto. -->
  <!-- sfondo -->
  <circle cx="246" cy="168" r="150" fill="#fde7cf"/>
  <circle cx="66" cy="66" r="18" fill="#f4b13c" opacity=".9"/>
  <circle cx="440" cy="120" r="6" fill="#f4b13c" opacity=".7"/>
  <circle cx="420" cy="200" r="5" fill="#e8833a" opacity=".6"/>
  <ellipse cx="240" cy="300" rx="206" ry="22" fill="#d9ebe0"/>

  <!-- vapore e cuoricini -->
  <g fill="none" stroke="#c99a6b" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M246 140 q-7 -9 0 -18 q7 -9 0 -18"/>
    <path d="M262 136 q-7 -9 0 -18 q7 -9 0 -18"/>
    <path d="M278 140 q-7 -9 0 -18 q7 -9 0 -18"/>
  </g>
  <path d="M318 84 c-6 -9 -20 -4 -14 7 l14 12 l14 -12 c6 -11 -8 -16 -14 -7 z" fill="#e8833a" opacity=".85"/>
  <path d="M206 62 c-4 -6 -13 -3 -9 5 l9 8 l9 -8 c4 -8 -5 -11 -9 -5 z" fill="#e8833a" opacity=".6"/>

  <!-- robot -->
  <g>
    <line x1="150" y1="64" x2="150" y2="42" stroke="#1c2420" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="36" r="9" fill="#f4b13c"/>
    <rect x="96" y="88" width="12" height="26" rx="5" fill="#1f6f4a"/>
    <rect x="192" y="88" width="12" height="26" rx="5" fill="#1f6f4a"/>
    <rect x="104" y="62" width="92" height="74" rx="24" fill="#2f8a5f"/>
    <rect x="116" y="75" width="68" height="48" rx="15" fill="#123324"/>
    <circle cx="137" cy="96" r="6.5" fill="#a6f0c8"/>
    <circle cx="163" cy="96" r="6.5" fill="#a6f0c8"/>
    <path d="M137 108 q13 11 26 0" fill="none" stroke="#a6f0c8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="125" cy="110" r="4" fill="#e8833a" opacity=".55"/>
    <circle cx="175" cy="110" r="4" fill="#e8833a" opacity=".55"/>
    <rect x="139" y="134" width="22" height="10" fill="#1f6f4a"/>
    <!-- braccio sinistro a riposo -->
    <path d="M116 166 q-22 18 -18 46" fill="none" stroke="#1f6f4a" stroke-width="13" stroke-linecap="round"/>
    <circle cx="98" cy="214" r="9" fill="#f4b13c"/>
    <!-- corpo -->
    <rect x="108" y="142" width="84" height="96" rx="26" fill="#2f8a5f"/>
    <rect x="124" y="158" width="52" height="40" rx="12" fill="#e4f1ea"/>
    <path d="M150 170 c-5 -8 -17 -4 -12 6 l12 10 l12 -10 c5 -10 -7 -14 -12 -6 z" fill="#e8833a"/>
    <rect x="132" y="208" width="36" height="8" rx="4" fill="#1f6f4a"/>
    <!-- base con ruote -->
    <rect x="116" y="236" width="68" height="20" rx="10" fill="#1f6f4a"/>
    <circle cx="132" cy="272" r="17" fill="#1c2420"/>
    <circle cx="168" cy="272" r="17" fill="#1c2420"/>
    <circle cx="132" cy="272" r="6" fill="#cfd8d3"/>
    <circle cx="168" cy="272" r="6" fill="#cfd8d3"/>
    <!-- braccio destro teso verso la famiglia -->
    <path d="M186 168 q26 2 40 -4" fill="none" stroke="#1f6f4a" stroke-width="13" stroke-linecap="round"/>
    <circle cx="230" cy="163" r="9" fill="#f4b13c"/>
  </g>

  <!-- ciotola -->
  <path d="M226 150 h72 a36 30 0 0 1 -72 0 z" fill="#e8833a"/>
  <path d="M238 168 h48" stroke="#f4b13c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="262" cy="150" rx="36" ry="7" fill="#f7c66b"/>
  <circle cx="252" cy="148" r="3" fill="#7fb069"/>
  <circle cx="266" cy="147" r="3" fill="#7fb069"/>
  <circle cx="276" cy="150" r="2.5" fill="#c1502e"/>

  <!-- adulto (dietro) -->
  <g>
    <path d="M352 160 q36 -16 72 0 l16 140 h-104 z" fill="#2f6aa3"/>
    <path d="M370 168 l18 22 l18 -22" fill="none" stroke="#f4b13c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="380" y="140" width="16" height="18" rx="6" fill="#8a5a3c"/>
    <circle cx="388" cy="118" r="27" fill="#8a5a3c"/>
    <path d="M360 112 q2 -32 30 -32 q28 0 30 30 q-14 -14 -30 -12 q-18 2 -30 14 z" fill="#f4b13c"/>
    <circle cx="410" cy="88" r="8" fill="#e8833a"/>
    <path d="M376 120 q5 -5 10 0 M392 120 q5 -5 10 0" fill="none" stroke="#2a1a10" stroke-width="3" stroke-linecap="round"/>
    <path d="M379 130 q9 8 18 0" fill="none" stroke="#2a1a10" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- bambino (davanti) -->
  <g>
    <path d="M308 222 q20 -12 40 0 l8 78 h-56 z" fill="#e2543f"/>
    <!-- braccio teso verso la ciotola -->
    <path d="M312 230 q-20 -26 -13 -68" fill="none" stroke="#c68a5c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="299" cy="161" r="7" fill="#c68a5c"/>
    <circle cx="328" cy="196" r="20" fill="#c68a5c"/>
    <path d="M308 192 q2 -22 22 -22 q20 1 18 22 q-8 -9 -19 -9 q-12 0 -21 9 z" fill="#3b2617"/>
    <path d="M319 198 q4 -4 8 0 M331 198 q4 -4 8 0" fill="none" stroke="#2a1a10" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M321 206 q7 6 14 0" fill="none" stroke="#2a1a10" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- mano dell'adulto sulla spalla del bambino -->
  <path d="M362 172 q-6 30 -14 52" fill="none" stroke="#8a5a3c" stroke-width="11" stroke-linecap="round"/>
  <circle cx="347" cy="226" r="7" fill="#8a5a3c"/>
</svg>
